# AgentMeter — extra models users may benchmark next to the 5 study models.
#
# AgentMeter MEASURES LLM resource efficiency; it is not a threat-detection product.
#
# Every model here is benchmarked exactly like the study models: AgentMeter downloads the
# ORIGINAL weights (fp16/bf16/fp32 safetensors) and quantizes them itself at load time to
# 4-bit NF4 (bitsandbytes, double quantization, fp16 compute — configs/run_full_l4.yaml).
# So list the base repo, never a pre-quantized copy (-GPTQ, -AWQ, -GGUF, -EXL2, 2/3-bit):
# configs/model_rules.yaml blocks those.
#
# The 5 study models (the validated baseline) are NOT listed here; they come from
# configs/run_full_l4.yaml and never change. Models here are "extra — not in the validated
# baseline". Users never type a model id: they pick from this list. A model is offered only
# when its suitability is "ok" (configs/model_rules.yaml), the admin enabled it and — on a
# real GPU — it passed the admin's 4-bit verification (which also checks that the weights
# really are 4-bit). Gated models are offered too, labelled "licence verification required".
#
# The list is not limited to the study models' families or to dense transformers: any
# text-generation model with original safetensors weights that transformers loads natively
# (no trust_remote_code) and bitsandbytes can quantize to 4-bit NF4 qualifies.
#
# Fields: id (Hugging Face repo, original weights), family, type (architecture, shown on the
#         model card), note (shown on the model card),
#         download_at_start (default false): true = scripts/vast_models.py downloads it together
#         with the study models when a rental starts, so the first benchmark with it has no wait.
#         Otherwise it is downloaded the first time a benchmark uses it (a few minutes; shown
#         as "Downloading model …" before the benchmark starts — never part of a measurement).

version: 1

models:
  # --- dense transformers, families of the study models ---------------------------------
  - id: Qwen/Qwen2.5-1.5B-Instruct
    family: Qwen2.5
    type: dense transformer
    note: Very small; the low end of the Qwen2.5 size range.
  - id: Qwen/Qwen2.5-3B-Instruct
    family: Qwen2.5
    type: dense transformer
    note: Small Qwen2.5; compare with the 7B study model.
  - id: Qwen/Qwen2.5-14B-Instruct
    family: Qwen2.5
    type: dense transformer
    note: Large Qwen2.5; the high end of the size range on a 24 GB GPU.
  - id: microsoft/Phi-3.5-mini-instruct
    family: Phi-3.5
    type: dense transformer
    note: Newer version of the Phi-3-mini study model.
  - id: microsoft/Phi-4-mini-instruct
    family: Phi-4
    type: dense transformer
    note: Newest small Phi model (MIT licence).
  - id: meta-llama/Llama-3.2-3B-Instruct
    family: Llama 3.2
    type: dense transformer
    note: Small Llama; compare with the Llama-3-8B study model.
  - id: google/gemma-2-2b-it
    family: Gemma 2
    type: dense transformer
    note: Small Gemma 2; compare with the gemma-2-9b study model.
  - id: mistralai/Mistral-Nemo-Instruct-2407
    family: Mistral NeMo
    type: dense transformer
    note: Mid-size (12B) Mistral model.

  # --- dense transformers, other families -----------------------------------------------
  - id: HuggingFaceTB/SmolLM2-1.7B-Instruct
    family: SmolLM2
    type: dense transformer
    note: Ultra-light model; a lower bound for resource use.
  - id: ibm-granite/granite-3.1-8b-instruct
    family: Granite 3.1
    type: dense transformer
    note: Enterprise-oriented 8B model, Apache-2.0.
  - id: tiiuae/Falcon3-7B-Instruct
    family: Falcon3
    type: dense transformer
    note: 7B model from TII (UAE).
  - id: allenai/OLMo-2-1124-7B-Instruct
    family: OLMo 2
    type: dense transformer
    note: Fully open model (weights, data and training code published).
  - id: 01-ai/Yi-1.5-9B-Chat
    family: Yi-1.5
    type: dense transformer
    note: 9B bilingual (English/Chinese) model.
  - id: CohereForAI/aya-expanse-8b
    family: Aya Expanse
    type: dense transformer
    note: Multilingual 8B model (23 languages); non-commercial licence.

  # --- other architectures ---------------------------------------------------------------
  - id: allenai/OLMoE-1B-7B-0924-Instruct
    family: OLMoE
    type: mixture of experts (7B total, ~1B active per token)
    note: Sparse MoE; shows how expert routing changes speed and memory against dense models.
  - id: tiiuae/Falcon3-Mamba-7B-Instruct
    family: Falcon3-Mamba
    type: state-space model (Mamba, no attention)
    note: No KV cache; memory should stay flat as prompts grow — a contrast to transformers.
