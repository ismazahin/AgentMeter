name: tests

# CPU-only test suite (no GPU, no tokens, no network). Runs on pushes and PRs.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node (for the saw.js / report.js parity tests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt flask
          # PCAP input layer: cicflowmeter pins numpy<2 but runs on numpy 2, so it is
          # installed WITHOUT its pins (see requirements-pcap.txt). Fail here rather
          # than letting tests/test_pcap_ingest.py skip silently.
          pip install -r requirements-pcap.txt
          pip install --no-deps cicflowmeter==0.2.0
          python -c "import scapy, cicflowmeter.flow_session"

      - name: Run tests
        run: pytest

  controlplane:
    # The control plane (Supabase Edge Function: supabase/functions/agentmeter) — vitest in Node:
    # once on PGlite (in-process Postgres), once through postgres.js on a real Postgres server.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: controlplane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: controlplane/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Control-plane tests (PGlite)
        run: npx vitest run
      - name: Control-plane tests (postgres.js on Postgres 16)
        run: npx vitest run
        env: { TEST_DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres" }
