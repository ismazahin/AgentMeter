# Phase 4 CPU smoke config — proves the HF adapter plumbing end to end
# (load -> chat/plain encode -> streaming generate -> TTFT + exact token counts)
# using a TINY, PUBLIC, UNGATED model. No HF token, no GPU, no cost.
#
# This is NOT a measurement run: gpt2 is not an instruct model, so verdicts
# will be poor and VRAM is unavailable on CPU. It only validates that the
# real transformers code path works before the GPU pilot.
#
# Run:  python main.py --config configs/smoke_gpt2.yaml bench --n 2

run:
  mode: pilot
  device: cpu           # explicit dev choice (allowed only because require_gpu is false)
  require_gpu: false
  seed: 42

model:
  provider: hf
  name: gpt2            # public, ungated, ~500MB
  hf:
    token_env: HF_TOKEN
    dtype: float32      # CPU
    device_map: null
    max_new_tokens: 24  # keep CPU generation fast
    temperature: 0.0
    do_sample: false
  mock:
    latency_s: 0.0

dataset:
  path: data/demo_flows.csv
  label_column: Label
  id_column: null
  drop_columns: []
  limit: 2
  max_feature_chars: 4000

pipeline:
  agents:
    - perceive
    - reason
    - decide
    - act

classes:
  - Brute Force
  - Volumetric DDoS
  - Port Scanning
  - DoS Hulk
  - Benign

mitre:
  Brute Force: "T1110 - Brute Force"
  Volumetric DDoS: "T1498 - Network Denial of Service"
  Port Scanning: "T1046 - Network Service Discovery"
  DoS Hulk: "T1499 - Endpoint Denial of Service"
  Benign: "N/A - No adversary technique"

scoring:
  weights:
    accuracy: 0.40
    latency: 0.25
    vram: 0.20
    tokens: 0.15
  targets:
    accuracy_pct: 80.0
    latency_s: 5.0
    vram_mb: 16000.0
    tokens_total: 1200.0
  tiers:
    healthy_min: 80.0
    degraded_min: 60.0
  sensitivity_weight_sets:
    equal: {accuracy: 0.25, latency: 0.25, vram: 0.25, tokens: 0.25}

storage:
  sqlite_path: results/agentmeter.db

output:
  results_dir: results
