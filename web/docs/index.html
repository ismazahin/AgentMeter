<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentMeter API</title>
<meta name="description" content="Every endpoint of AgentMeter's control plane, GPU backend and cloud preparation service, from the OpenAPI documents in this folder.">
<style>
  :root { --bg: #F4F2EC; --surface: #FBFAF6; --text: #17232C; --muted: #5d6971; --border: #DCD8CD; --accent: #2455D6; --get: #2e7d5b; --post: #2455D6; --put: #9a6a00; --patch: #7a4cc2; --delete: #b2361f; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101418; --surface: #161b20; --text: #E9E7E1; --muted: #a2abb2; --border: #2a3238; --accent: #6f9bf0; --get: #5cc497; --post: #6f9bf0; --put: #e0b14a; --patch: #b593f0; --delete: #f08a74; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  header { padding: 24px 16px 8px; max-width: 1180px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 30px; }
  .lead { margin: 0; color: var(--muted); max-width: 820px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 0; }
  .tab { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 7px 14px; border-radius: 999px; cursor: pointer; font: inherit; }
  .tab[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #q { flex: 1 1 220px; min-width: 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; }
  main { max-width: 1180px; margin: 0 auto; padding: 8px 16px 48px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; }
  @media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); } nav.toc { display: none; } }
  nav.toc { position: sticky; top: 12px; align-self: start; font-size: 14px; }
  nav.toc a { display: block; padding: 3px 0; text-decoration: none; color: var(--muted); }
  nav.toc a:hover { color: var(--text); }
  .intro { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin: 8px 0 18px; }
  h2 { font-size: 20px; margin: 26px 0 10px; }
  details.op { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin: 8px 0; }
  details.op > summary { list-style: none; cursor: pointer; display: flex; gap: 10px; align-items: baseline; padding: 10px 14px; flex-wrap: wrap; }
  details.op > summary::-webkit-details-marker { display: none; }
  .m { font: 700 12px/1 ui-monospace, monospace; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; color: #fff; min-width: 58px; text-align: center; }
  .m.get { background: var(--get); } .m.post { background: var(--post); } .m.put { background: var(--put); } .m.patch { background: var(--patch); } .m.delete { background: var(--delete); }
  .path { font: 14px ui-monospace, monospace; overflow-wrap: anywhere; }
  .sum { color: var(--muted); }
  .who { margin-left: auto; font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .body { padding: 0 14px 12px; border-top: 1px solid var(--border); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 8px 0; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  code { font: 13px ui-monospace, monospace; }
  .wrap { overflow-x: auto; }
  .none { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>AgentMeter API</h1>
  <p class="lead">Every endpoint of the three services, read from the OpenAPI documents next to this page
    (<a href="openapi-control-plane.json">control plane</a>, <a href="openapi-gpu-backend.json">GPU backend</a>,
    <a href="openapi-cloud-prep.json">cloud preparation</a>). Errors always come as <code>{"error": "…", "code": "…"}</code>.</p>
  <div class="bar" role="tablist" aria-label="Service">
    <button class="tab" role="tab" data-doc="openapi-control-plane.json" aria-selected="true">Control plane</button>
    <button class="tab" role="tab" data-doc="openapi-gpu-backend.json" aria-selected="false">GPU backend</button>
    <button class="tab" role="tab" data-doc="openapi-cloud-prep.json" aria-selected="false">Cloud preparation</button>
    <input id="q" type="search" placeholder="Filter: path, words, method…" aria-label="Filter the endpoints">
  </div>
</header>
<main>
  <nav class="toc" id="toc" aria-label="Topics"></nav>
  <div id="doc" aria-live="polite"><p class="none">Loading…</p></div>
</main>
<script src="docs.js"></script>
</body>
</html>
