# Phase 5 PILOT config — Google Colab FREE tier (1x NVIDIA T4, 15 GB VRAM).
#
# A 7-8B model does NOT fit in fp16 on a 15 GB T4, so this pilot uses 4-bit
# (NF4) quantization via bitsandbytes. QUANTIZATION IS A DECLARED METHODOLOGY
# CHANGE — the VRAM/latency/token numbers are for the quantized model, and any
# model comparison must use the same quantization for fairness.
#
# Run (in Colab, GPU runtime):
#   python main.py --config configs/pilot_colab_t4.yaml pilot

run:
  mode: pilot
  device: cuda
  require_gpu: true      # STOP if no CUDA — no silent CPU fallback
  seed: 42
  free_vram_tolerance_mb: 500   # warn if VRAM doesn't return to baseline between models
  cleanup_model_cache_after: true   # delete each model's HF cache after it finishes (avoids Colab disk fill on multi-model runs)

model:
  provider: hf
  name: mistralai/Mistral-7B-Instruct-v0.3   # or meta-llama/Meta-Llama-3-8B-Instruct
  hf:
    token_env: HF_TOKEN
    dtype: float16
    device_map: null
    max_new_tokens: 200
    temperature: 0.0
    do_sample: false
    quantization:
      load_in_4bit: true            # <-- fits the T4
      load_in_8bit: false
      bnb_4bit_quant_type: nf4
      bnb_4bit_use_double_quant: true
      bnb_4bit_compute_dtype: float16
  mock:
    latency_s: 0.0

dataset:
  path: data/cicids_pilot.csv   # real CIC-IDS pilot sample (78 features + Label)
  label_column: Label
  id_column: null
  drop_columns: []
  limit: 10             # 10 rows in this sample; all scorable against the 5 classes
  max_feature_chars: 4000
  label_map: {}         # no remapping — DoS Hulk is a first-class label
  drop_labels: []       # no dropping — all rows kept

pipeline:
  agents:
    - perceive
    - reason
    - decide
    - act
  max_new_tokens:
    perceive: 160
    reason: 200
    decide: 12
    act: 160

classes:
  - Brute Force
  - Volumetric DDoS
  - Port Scanning
  - DoS Hulk
  - Benign

mitre:
  Brute Force: "T1110 - Brute Force"
  Volumetric DDoS: "T1498 - Network Denial of Service"
  Port Scanning: "T1046 - Network Service Discovery"
  DoS Hulk: "T1499 - Endpoint Denial of Service"
  Benign: "N/A - No adversary technique"

# Triage policy: what an analyst does with each predicted class (Escalate / Investigate /
# Dismiss). The model never chooses it; it is looked up like the MITRE technique. A class not
# named here, or an unparseable answer, goes to Investigate.
triage:
  Brute Force: Escalate
  Volumetric DDoS: Escalate
  DoS Hulk: Escalate
  Port Scanning: Investigate
  Benign: Dismiss

# Severity: each class -> a Snort/Suricata classtype; its default priority in
# classification.config gives the level (1 High, 2 Medium, 3 Low). MITRE ATT&CK has no
# severity and network flows carry no CVE, so a published IDS source is used instead.
severity:
  Brute Force: attempted-user
  Volumetric DDoS: attempted-dos
  DoS Hulk: attempted-dos
  Port Scanning: attempted-recon
  Benign: not-suspicious

# Triage gate: a model is recommended for triage only if it meets every limit. Defaults:
# Tier-2 analyst parity reported in research (SIR-Bench, arXiv 2604.12040: 85-90% of true
# positives detected, 70-80% of false positives rejected), lower end; the valid-answer floor
# is this study's choice. Context only: never part of the efficiency score or the ranking.
triage_gate:
  max_missed_attack_rate: 0.15
  max_false_escalation_rate: 0.30
  min_valid_rate: 0.95

scoring:
  weights:
    accuracy: 0.40
    latency: 0.25
    vram: 0.20
    tokens: 0.15
  # Where the targets below come from. "placeholder" until scripts/calibrate_targets.py
  # is run on the first real GPU study run (the reports say so while it is a placeholder).
  targets_source: placeholder
  targets:
    accuracy_pct: 80.0
    latency_s: 5.0
    vram_mb: 16000.0
    tokens_total: 1200.0
  tiers:
    healthy_min: 80.0
    degraded_min: 60.0
  sensitivity_weight_sets:
    equal: {accuracy: 0.25, latency: 0.25, vram: 0.25, tokens: 0.25}
    accuracy_heavy: {accuracy: 0.55, latency: 0.20, vram: 0.15, tokens: 0.10}
    efficiency_heavy: {accuracy: 0.25, latency: 0.30, vram: 0.30, tokens: 0.15}

storage:
  sqlite_path: results/agentmeter.db

output:
  results_dir: results
