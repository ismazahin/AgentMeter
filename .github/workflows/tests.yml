name: tests

# CPU-only test suite (no GPU, no tokens, no network). Runs on pushes and PRs.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node (for the saw.js / report.js parity tests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt flask flask-cors
          # PCAP input layer: cicflowmeter pins numpy<2 but runs on numpy 2, so it is
          # installed WITHOUT its pins (see requirements-pcap.txt). Fail here rather
          # than letting tests/test_pcap_ingest.py skip silently.
          pip install -r requirements-pcap.txt
          pip install --no-deps cicflowmeter==0.2.0
          python -c "import scapy, cicflowmeter.flow_session"

      - name: Run tests
        run: pytest
