# Phase 5 PILOT config — 1 real model, in-process on a GPU (Mode A).
# Target host: Hugging Face Space, 1x NVIDIA L4 (24 GB). INCURS GPU COST.
#
# Run on the GPU host:  python main.py --config configs/pilot_mistral_l4.yaml pilot
# (or use the Gradio Space app in space/app.py)

run:
  mode: pilot
  device: cuda          # in-process on the GPU
  require_gpu: true      # STOP if torch.cuda is unavailable — no silent CPU fallback
  seed: 42

model:
  provider: hf
  name: mistralai/Mistral-7B-Instruct-v0.3   # gated: accept the licence + set HF_TOKEN
  hf:
    token_env: HF_TOKEN
    dtype: float16       # fits the L4's 24 GB
    device_map: null
    max_new_tokens: 200
    temperature: 0.0
    do_sample: false
  mock:
    latency_s: 0.0

dataset:
  path: data/cicids_pilot.csv   # real CIC-IDS pilot sample (78 features + Label)
  label_column: Label
  id_column: null
  drop_columns: []
  limit: 10              # all 10 rows, scorable against the 5 classes
  max_feature_chars: 4000
  label_map: {}
  drop_labels: []

pipeline:
  agents:
    - perceive
    - reason
    - decide
    - act
  max_new_tokens:
    perceive: 160
    reason: 200
    decide: 12
    act: 160

classes:
  - Brute Force
  - Volumetric DDoS
  - Port Scanning
  - DoS Hulk
  - Benign

mitre:
  Brute Force: "T1110 - Brute Force"
  Volumetric DDoS: "T1498 - Network Denial of Service"
  Port Scanning: "T1046 - Network Service Discovery"
  DoS Hulk: "T1499 - Endpoint Denial of Service"
  Benign: "N/A - No adversary technique"

scoring:
  weights:
    accuracy: 0.40
    latency: 0.25
    vram: 0.20
    tokens: 0.15
  targets:
    accuracy_pct: 80.0
    latency_s: 5.0
    vram_mb: 16000.0
    tokens_total: 1200.0
  tiers:
    healthy_min: 80.0
    degraded_min: 60.0
  sensitivity_weight_sets:
    equal: {accuracy: 0.25, latency: 0.25, vram: 0.25, tokens: 0.25}
    accuracy_heavy: {accuracy: 0.55, latency: 0.20, vram: 0.15, tokens: 0.10}
    efficiency_heavy: {accuracy: 0.25, latency: 0.30, vram: 0.30, tokens: 0.15}

storage:
  sqlite_path: results/agentmeter.db

output:
  results_dir: results
