# The session explainer: an open-source LLM that writes each session's explanations from its
# finished results, as the LAST step of the session (agentmeter/session/explain.py). It is never
# benchmarked, never scored and never in configs/model_catalog.yaml. It runs on the session's own
# rented GPU after every measured model has released it, in its own process.
enabled: true
# Tried in order among those whose memory need fits the GPU; a model that fails gives way to the next.
# Trial on an RTX 3090 (2026-11-11, transformers 5.22): Apertus-8B wrote the explanations;
# gpt-oss-20b loaded but could not run there (MXFP4 experts left on the CPU), so it comes second.
models:
  - id: swiss-ai/Apertus-8B-Instruct-2509   # Apache 2.0; plain transformers, no custom code
    engine: hf
    min_free_vram_gb: 18             # bf16 weights
  - id: openai/gpt-oss-20b          # Apache 2.0; mixture of experts, about 3.6B active per token
    engine: hf                       # hf (transformers) or vllm
    min_free_vram_gb: 16
    reasoning: low                   # gpt-oss only: low reasoning keeps it fast
max_new_tokens: 1800
timeout_s: 480                       # the explainer process is killed after this (one request per section)
retries: 1                           # one more request for a section that failed a check, with the reasons
excerpts: 12                         # agent-answer excerpts sent (failures and mix-ups first)
excerpt_chars: 200
slow_flows_per_model: 5
# What the answers show: code groups the answers that went wrong; the model names one pattern per
# group, kept only when its quote and key phrase are found in the answers (answer_patterns.py).
answer_patterns:
  max_groups: 4                      # the largest groups first
  min_group: 3                       # fewer answers than this are not a pattern
  sample: 8                          # answers of the group shown to the model
  contrast: 8                        # answers of the same step that did not go wrong
